name: Coverage check

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 5'
  push:
    branches:
      - main
    paths:
      - 'anyvm.py'
      - '.github/workflows/*.yml'
      - '.github/coverage.allow'
      - '.github/check_coverage.py'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: python3 -c "import yaml" || pip install --break-system-packages pyyaml
      - name: Run checker unit tests
        run: python3 -m unittest discover -s .github -p "test_*.py" -v
      - name: Check coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/check_coverage.py
